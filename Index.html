<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeenWallet</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="logo">
        <img src="./Images/T-Photoroom.png" alt="" width="100" height="100">
    </header>
    <form class="inicio">
        <p>Bienvenido a <span class="destacado">Teen<span class="wallet">Wallet</span></span>, a continuación inicie
            sesión para ingresar a tu nueva forma de administrar tu dinero.</p>
        <p class="wallet">Iniciar sesión</p>
        <input required id="correo" class="inputs" type="text" placeholder="Correo electrónico">
        <br>
        <input required id="password" class="inputs" type="text" placeholder="Contraseña">
        <div class="contenedor">
            <button class="btn-iniciar" type="submit">Iniciar sesión</button>
        </div>
    </form>

    <div class="registro">
        <p>¿No tienes cuenta? <a href="">Crea una</a></p>
    </div>
</body>

</html>
